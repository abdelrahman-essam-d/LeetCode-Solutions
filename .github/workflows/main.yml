name: Sync LeetCode

on:
  workflow_dispatch:
  schedule:
    # بيشتغل أوتوماتيك كل يوم الساعة 12 بالليل
    - cron: '0 0 * * *' 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Sync LeetCode Code
        uses: joshcai/leetcode-sync@v1.7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          leetcode-csrf-token: ${{ secrets.LEETCODE_TOKEN }}
          leetcode-session: ${{ secrets.LEETCODE_SESSION }}
          destination-folder: my-submissions
